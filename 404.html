<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Daschofsky for Sheriff 2026</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: oklch(0.13 0.008 80);
    --bg-stripe: oklch(0.10 0.006 80);
    --text-bright: oklch(0.96 0.005 80);
    --text-muted: oklch(0.72 0.008 80);
    --text-dim: oklch(0.55 0.008 80);
    --gold: oklch(0.78 0.13 85);
    --gold-deep: oklch(0.62 0.14 75);
    --line: oklch(0.30 0.008 80);
    --font-display: 'Anton', 'Impact', sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--bg-deep);
    color: var(--text-bright);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(oklch(0.96 0.005 80 / 0.02) 1px, transparent 1px),
      linear-gradient(90deg, oklch(0.96 0.005 80 / 0.02) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { max-width: 540px; text-align: center; }
  .logo { width: clamp(140px, 40vw, 220px); height: auto; margin: 0 auto 2.4rem; display: block; }
  .code {
    font-family: var(--font-display);
    font-size: clamp(4.5rem, 16vw, 8rem);
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: var(--gold);
    text-transform: uppercase;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-bright);
    margin: 0.6rem 0 1rem;
  }
  p {
    font-size: 1rem;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 40ch;
    margin: 0 auto 2.2rem;
  }
  .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 0.85rem 1.8rem;
    border-radius: 2px;
    transition: background 180ms, transform 180ms;
    display: inline-block;
  }
  .btn-primary { background: var(--gold); color: var(--bg-deep); }
  .btn-primary:hover { background: var(--gold-deep); transform: translateY(-2px); }
  .btn-ghost { border: 1px solid var(--line); color: var(--text-bright); }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/logo.png" alt="Ashley Daschofsky for Sheriff" class="logo">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for moved or never existed. Let's get you back on patrol.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/donate" class="btn btn-ghost">Donate</a>
    </div>
  </div>
</body>
</html>
