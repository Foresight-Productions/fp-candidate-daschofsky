<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 13 stripes: 7 red, 6 white -->
  <rect width="32" height="32" fill="#B22234"/>
  <rect y="2.46" width="32" height="2.46" fill="#fff"/>
  <rect y="7.38" width="32" height="2.46" fill="#fff"/>
  <rect y="12.31" width="32" height="2.46" fill="#fff"/>
  <rect y="17.23" width="32" height="2.46" fill="#fff"/>
  <rect y="22.15" width="32" height="2.46" fill="#fff"/>
  <rect y="27.08" width="32" height="2.46" fill="#fff"/>
  <!-- Blue canton -->
  <rect width="14" height="14" fill="#3C3B6E"/>
  <!-- Stars: 5×4 + 4×5 = 50, simplified to a 3×3 grid at favicon scale -->
  <g fill="#fff" font-size="2">
    <!-- Row 1 -->
    <circle cx="2.0" cy="2.0" r="0.9"/>
    <circle cx="4.7" cy="2.0" r="0.9"/>
    <circle cx="7.4" cy="2.0" r="0.9"/>
    <circle cx="10.1" cy="2.0" r="0.9"/>
    <circle cx="12.8" cy="2.0" r="0.9"/>
    <!-- Row 2 -->
    <circle cx="3.35" cy="4.0" r="0.9"/>
    <circle cx="6.05" cy="4.0" r="0.9"/>
    <circle cx="8.75" cy="4.0" r="0.9"/>
    <circle cx="11.45" cy="4.0" r="0.9"/>
    <!-- Row 3 -->
    <circle cx="2.0" cy="6.0" r="0.9"/>
    <circle cx="4.7" cy="6.0" r="0.9"/>
    <circle cx="7.4" cy="6.0" r="0.9"/>
    <circle cx="10.1" cy="6.0" r="0.9"/>
    <circle cx="12.8" cy="6.0" r="0.9"/>
    <!-- Row 4 -->
    <circle cx="3.35" cy="8.0" r="0.9"/>
    <circle cx="6.05" cy="8.0" r="0.9"/>
    <circle cx="8.75" cy="8.0" r="0.9"/>
    <circle cx="11.45" cy="8.0" r="0.9"/>
    <!-- Row 5 -->
    <circle cx="2.0" cy="10.0" r="0.9"/>
    <circle cx="4.7" cy="10.0" r="0.9"/>
    <circle cx="7.4" cy="10.0" r="0.9"/>
    <circle cx="10.1" cy="10.0" r="0.9"/>
    <circle cx="12.8" cy="10.0" r="0.9"/>
    <!-- Row 6 -->
    <circle cx="3.35" cy="12.0" r="0.9"/>
    <circle cx="6.05" cy="12.0" r="0.9"/>
    <circle cx="8.75" cy="12.0" r="0.9"/>
    <circle cx="11.45" cy="12.0" r="0.9"/>
  </g>
</svg>
