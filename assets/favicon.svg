<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 13 stripes: 7 red, 6 white -->
  <rect width="32" height="32" fill="#B22234"/>
  <rect y="2.46"  width="32" height="2.46" fill="#fff"/>
  <rect y="7.38"  width="32" height="2.46" fill="#fff"/>
  <rect y="12.31" width="32" height="2.46" fill="#fff"/>
  <rect y="17.23" width="32" height="2.46" fill="#fff"/>
  <rect y="22.15" width="32" height="2.46" fill="#fff"/>
  <rect y="27.08" width="32" height="2.46" fill="#fff"/>
  <!-- Blue canton -->
  <rect width="14" height="14" fill="#3C3B6E"/>
  <!-- 50 stars: 9 rows alternating 6 and 5 stars -->
  <g fill="#fff">
    <!-- Row 1 (y=1.0): 6 stars -->
    <circle cx="1.0"  cy="1.0" r="0.6"/>
    <circle cx="3.4"  cy="1.0" r="0.6"/>
    <circle cx="5.8"  cy="1.0" r="0.6"/>
    <circle cx="8.2"  cy="1.0" r="0.6"/>
    <circle cx="10.6" cy="1.0" r="0.6"/>
    <circle cx="13.0" cy="1.0" r="0.6"/>
    <!-- Row 2 (y=2.5): 5 stars -->
    <circle cx="2.2"  cy="2.5" r="0.6"/>
    <circle cx="4.6"  cy="2.5" r="0.6"/>
    <circle cx="7.0"  cy="2.5" r="0.6"/>
    <circle cx="9.4"  cy="2.5" r="0.6"/>
    <circle cx="11.8" cy="2.5" r="0.6"/>
    <!-- Row 3 (y=4.0): 6 stars -->
    <circle cx="1.0"  cy="4.0" r="0.6"/>
    <circle cx="3.4"  cy="4.0" r="0.6"/>
    <circle cx="5.8"  cy="4.0" r="0.6"/>
    <circle cx="8.2"  cy="4.0" r="0.6"/>
    <circle cx="10.6" cy="4.0" r="0.6"/>
    <circle cx="13.0" cy="4.0" r="0.6"/>
    <!-- Row 4 (y=5.5): 5 stars -->
    <circle cx="2.2"  cy="5.5" r="0.6"/>
    <circle cx="4.6"  cy="5.5" r="0.6"/>
    <circle cx="7.0"  cy="5.5" r="0.6"/>
    <circle cx="9.4"  cy="5.5" r="0.6"/>
    <circle cx="11.8" cy="5.5" r="0.6"/>
    <!-- Row 5 (y=7.0): 6 stars -->
    <circle cx="1.0"  cy="7.0" r="0.6"/>
    <circle cx="3.4"  cy="7.0" r="0.6"/>
    <circle cx="5.8"  cy="7.0" r="0.6"/>
    <circle cx="8.2"  cy="7.0" r="0.6"/>
    <circle cx="10.6" cy="7.0" r="0.6"/>
    <circle cx="13.0" cy="7.0" r="0.6"/>
    <!-- Row 6 (y=8.5): 5 stars -->
    <circle cx="2.2"  cy="8.5" r="0.6"/>
    <circle cx="4.6"  cy="8.5" r="0.6"/>
    <circle cx="7.0"  cy="8.5" r="0.6"/>
    <circle cx="9.4"  cy="8.5" r="0.6"/>
    <circle cx="11.8" cy="8.5" r="0.6"/>
    <!-- Row 7 (y=10.0): 6 stars -->
    <circle cx="1.0"  cy="10.0" r="0.6"/>
    <circle cx="3.4"  cy="10.0" r="0.6"/>
    <circle cx="5.8"  cy="10.0" r="0.6"/>
    <circle cx="8.2"  cy="10.0" r="0.6"/>
    <circle cx="10.6" cy="10.0" r="0.6"/>
    <circle cx="13.0" cy="10.0" r="0.6"/>
    <!-- Row 8 (y=11.5): 5 stars -->
    <circle cx="2.2"  cy="11.5" r="0.6"/>
    <circle cx="4.6"  cy="11.5" r="0.6"/>
    <circle cx="7.0"  cy="11.5" r="0.6"/>
    <circle cx="9.4"  cy="11.5" r="0.6"/>
    <circle cx="11.8" cy="11.5" r="0.6"/>
    <!-- Row 9 (y=13.0): 6 stars -->
    <circle cx="1.0"  cy="13.0" r="0.6"/>
    <circle cx="3.4"  cy="13.0" r="0.6"/>
    <circle cx="5.8"  cy="13.0" r="0.6"/>
    <circle cx="8.2"  cy="13.0" r="0.6"/>
    <circle cx="10.6" cy="13.0" r="0.6"/>
    <circle cx="13.0" cy="13.0" r="0.6"/>
  </g>
