<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 13 stripes: 7 red, 6 white -->
  <rect width="32" height="32" fill="#B22234"/>
  <rect y="2.46"  width="32" height="2.46" fill="#fff"/>
  <rect y="7.38"  width="32" height="2.46" fill="#fff"/>
  <rect y="12.31" width="32" height="2.46" fill="#fff"/>
  <rect y="17.23" width="32" height="2.46" fill="#fff"/>
  <rect y="22.15" width="32" height="2.46" fill="#fff"/>
  <rect y="27.08" width="32" height="2.46" fill="#fff"/>
  <!-- Blue canton -->
  <rect width="14" height="14" fill="#3C3B6E"/>
  <!-- 13 stars in a circle (Betsy Ross) — radius 4.5, center (7,7), 13 evenly spaced -->
  <g fill="#fff">
    <circle cx="7.00" cy="2.50" r="0.9"/>
    <circle cx="9.09" cy="3.01" r="0.9"/>
    <circle cx="10.70" cy="4.44" r="0.9"/>
    <circle cx="11.47" cy="6.46" r="0.9"/>
    <circle cx="11.21" cy="8.60" r="0.9"/>
    <circle cx="9.98"  cy="10.37" r="0.9"/>
    <circle cx="8.08"  cy="11.37" r="0.9"/>
    <circle cx="5.92"  cy="11.37" r="0.9"/>
    <circle cx="4.02"  cy="10.37" r="0.9"/>
    <circle cx="2.79"  cy="8.60" r="0.9"/>
    <circle cx="2.53"  cy="6.46" r="0.9"/>
    <circle cx="3.30"  cy="4.44" r="0.9"/>
    <circle cx="4.91"  cy="3.01" r="0.9"/>
  </g>
</svg>
